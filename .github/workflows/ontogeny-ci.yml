# Ontogeny module gate: backend tests, frontend suite, full-stack integration,
# plus the stage-1 zero-coupling invariant (this module must not import
# upstream hugegraph-llm/hugegraph-ml until the step-2 feature merge lands).
name: "Ontogeny CI"

on:
  push:
    branches:
      - "main"
    paths:
      - "ontogeny/**"
      - ".github/workflows/ontogeny-ci.yml"
  pull_request:
    paths:
      - "ontogeny/**"
      - ".github/workflows/ontogeny-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: ontogeny
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[mcp]' pytest pytest-asyncio httpx
      - name: Zero-coupling gate (stage 1)
        working-directory: ontogeny
        run: |
          # `! git grep` under bash -e can never fail; assert explicitly instead
          if git grep -qnE '^[[:space:]]*(from|import)[[:space:]]+(hugegraph_llm|hugegraph_ml|pyhugegraph|vermeer)' -- server extensions tests tools; then
            echo "::error::ontogeny imports upstream modules -- stage 1 must stay decoupled"
            exit 1
          fi
      - name: ASF header presence
        working-directory: ontogeny
        run: |
          # Belt to the repository-wide licenserc check: fail when any module
          # source file lacks the ASF header. Written with an explicit loop so
          # no `|| true` / `!` can mask the exit status (grep -L inverts it).
          failed=0
          while IFS= read -r f; do
            if ! grep -q "Licensed to the Apache Software Foundation" "$f"; then
              echo "::error file=$f::missing the ASF license header"
              failed=1
            fi
          done < <(find server extensions tests tools web/src -type f \( -name '*.py' -o -name '*.ts' -o -name '*.tsx' -o -name '*.sh' -o -name '*.yaml' -o -name '*.yml' -o -name 'Dockerfile' \) 2>/dev/null)
          exit "$failed"
      - name: Tests
        working-directory: ontogeny
        run: .venv/bin/pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ontogeny/web/package-lock.json
      - name: Install
        working-directory: ontogeny/web
        run: npm ci
      - name: Type check
        working-directory: ontogeny/web
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        working-directory: ontogeny/web
        run: npm run lint
      - name: Unit tests
        working-directory: ontogeny/web
        run: npx vitest run
      - name: Build
        working-directory: ontogeny/web
        run: npm run build

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend with PostgreSQL support
        working-directory: ontogeny
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[postgres,mcp]' pytest pytest-asyncio httpx
      - name: Start temporary PostgreSQL
        run: |
          export POSTGRES_PASSWORD="$(python -c 'import secrets; print(secrets.token_hex(24))')"
          docker run -d --rm --name ontogeny-ci-postgres \
            -e POSTGRES_USER=ontogeny -e POSTGRES_PASSWORD -e POSTGRES_DB=ontogeny \
            -p 127.0.0.1::5432 postgres:16 >/dev/null
          for attempt in $(seq 1 30); do
            if docker exec ontogeny-ci-postgres pg_isready -U ontogeny >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'PostgreSQL did not start' >&2
              exit 1
            fi
            sleep 1
          done
          port="$(docker port ontogeny-ci-postgres 5432/tcp | cut -d: -f2)"
          umask 077
          printf '%s' "$POSTGRES_PASSWORD" > "$RUNNER_TEMP/ontogeny-postgres-password"
          printf '%s' "$port" > "$RUNNER_TEMP/ontogeny-postgres-port"
      - name: PostgreSQL concurrency tests
        working-directory: ontogeny
        run: |
          audit_password="$(cat "$RUNNER_TEMP/ontogeny-postgres-password")"
          audit_port="$(cat "$RUNNER_TEMP/ontogeny-postgres-port")"
          export ONTOGENY_PG_DSN="postgresql+asyncpg://ontogeny:${audit_password}@127.0.0.1:${audit_port}/ontogeny"
          set -o pipefail
          .venv/bin/pytest -q tests/test_postgres_id_sequence.py 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_agent_governance.py -k postgres 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_agent_identity_and_run_claim.py::test_concurrent_run_claim_on_postgres 2>&1 | sed "s/${audit_password}/[redacted]/g"
          PYTHONPATH=tests .venv/bin/pytest -p pg_agent_plugin tests/test_agent_atomicity.py \
            -k 'failed_second_effect or simultaneous_decisions or approval_preserves' -q 2>&1 | sed "s/${audit_password}/[redacted]/g"
          PYTHONPATH=tests .venv/bin/pytest -p pg_agent_plugin tests/test_action_effect_order.py -q 2>&1 | sed "s/${audit_password}/[redacted]/g"
          PYTHONPATH=tests .venv/bin/pytest -p pg_agent_plugin tests/test_action_plan_and_projection_events.py \
            -k 'function_plan or created_object' -q 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_source_snapshot_and_native_values.py 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_postgres_watermark_sync.py 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_outbox_receipts.py tests/test_object_live_uniqueness.py 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_postgres_object_keys.py tests/test_auth_postgres_concurrency.py 2>&1 | sed "s/${audit_password}/[redacted]/g"
          .venv/bin/pytest -q tests/test_typed_json_storage.py tests/test_service_schema_commit.py 2>&1 | sed "s/${audit_password}/[redacted]/g"
          PYTHONPATH=tests .venv/bin/pytest -p pg_agent_plugin tests/test_action_idempotency_scope.py tests/test_approval_marked_policy.py -q 2>&1 | sed "s/${audit_password}/[redacted]/g"
      - name: Stop temporary PostgreSQL
        if: always()
        run: |
          docker stop ontogeny-ci-postgres >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/ontogeny-postgres-password" "$RUNNER_TEMP/ontogeny-postgres-port"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: ontogeny
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e '.[mcp]' pytest pytest-asyncio httpx
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ontogeny/web/package-lock.json
      - name: Install frontend
        working-directory: ontogeny/web
        run: npm ci
      - name: Integration tests (real server)
        working-directory: ontogeny/web
        run: npm run test:e2e
