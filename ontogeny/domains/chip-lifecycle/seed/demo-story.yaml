# Demo story: acts the seed rows into a living chip lifecycle.
#
# seed/*.sql provides the nouns (data); this file provides the verbs (action
# and function calls) — both owned by the example, the engine stays generic.
#
# Executed by `ontogeny serve --demo` (fresh / --reseeded demo state) or by
# tools/seed_demo.py against a running instance.
#
# Fields:
#   principals  identities (Role drives Cedar decisions, site drives row filters)
#   steps[].id  step name; later steps may reference a created object as $<id>
#   steps[].action / function  one or the other; actions may carry a target
#               (omitted = creating action)
#   steps[].expect  ok / denied / rejected — anything else gets flagged red
#
# Plot: authority check → tapeout (rule → policy → effects incl. webhook → audit)
# → fab execution → yield gate → field failure → functions.
principals:
  product: { id: u-product, Role: [product], site: hq }
  fab: { id: u-fab, Role: [fab], site: fab-site-a }
  cqe: { id: u-cqe, Role: [cqe], site: hq }

steps:
  # --- authority first: a fab engineer may not tape out (Cedar default deny,
  # the refusal is audited too, so this is a *meaningful* negative sample) -----
  - action: tapeout
    principal: fab
    target: TO-A1
    parameters: {}
    expect: denied

  # --- tapeout: rule (only PLANNED) → policy (product) → effects → audit ------
  # TO-A1 is an X1 version, so the conditional webhook fires as well
  - id: tapeout-a1
    action: tapeout
    principal: product
    target: TO-A1
    parameters: {}
    expect: ok

  # taping out twice trips the rule before policy even runs (rule guard sample)
  - action: tapeout
    principal: product
    target: TO-A1
    parameters: {}
    expect: rejected

  # --- fab floor: the RUNNING etch step completes, a completed one cannot -----
  - action: complete-process-step
    principal: fab
    target: PS-7132
    parameters: { note: 'Etch finished on EQ-07, lot fed forward to deposition' }
    expect: ok

  - action: complete-process-step
    principal: fab
    target: PS-7111
    parameters: { note: 'Late re-report of an already completed step' }
    expect: rejected

  # --- routing: set-link moves a queued step to another etcher ---------------
  - action: reassign-step
    principal: fab
    target: PS-7212
    parameters: { equipment_id: EQ-07 }
    expect: ok

  # --- hold: modify-target + modify-linked (in-flight steps go back to queued) -
  - action: hold-lot
    principal: fab
    target: LOT-2419
    parameters: { reason: 'Yield investigation on EQ-07 lots' }
    expect: ok

  # --- yield gate: defect count above tested quantity trips a rule -----------
  - action: record-wafer-test
    principal: fab
    parameters:
      lot_id: LOT-2419
      tested_qty: 40
      defect_qty: 41
      result: FAIL
      tester: cp-eng-02
    expect: rejected

  - id: record-wt
    action: record-wafer-test
    principal: fab
    parameters:
      lot_id: LOT-2419
      tested_qty: 40
      defect_qty: 2
      result: PASS
      tester: cp-eng-02
    expect: ok

  # --- yield: a mistaken CP entry is soft-deleted (archive-object) -----------
  - action: retract-wafer-test
    principal: fab
    target: WT-503
    parameters: { reason: 'Double entry — same CP run recorded twice' }
    expect: ok

  # --- alert + root cause on the failing lot: cqe may not write fab records --
  - action: raise-yield-alert
    principal: cqe
    target: WT-501
    parameters: { severity: MAJOR, kind: YIELD_DROP }
    expect: denied

  - action: raise-yield-alert
    principal: fab
    target: WT-501
    parameters: { severity: MAJOR, kind: YIELD_DROP }
    expect: ok

  - action: record-root-cause
    principal: fab
    target: WT-501
    parameters:
      root_cause: 'Etch window offset on EQ-07'
      root_cause_class: PROCESS
      confidence: 0.82
    expect: ok

  # --- field: a customer return is opened and flagged as a surge -------------
  - id: open-ff
    action: open-field-failure
    principal: cqe
    parameters:
      customer_id: C-201
      symptom: 'IO pin leakage above 10 nA at 25 °C on port bank B'
      failure_mode: PARAMETRIC
    expect: ok

  - action: raise-surge-alert
    principal: cqe
    target: FF-8001
    parameters: { severity: MAJOR, kind: DEFECT_SURGE }
    expect: ok

  # --- functions: read-only sandboxed analysis over the same objects ----------
  - function: requirement-impact
    principal: product
    parameters: { requirement_id: REQ-101 }
    expect: ok

  - function: analyze-yield-loss
    principal: fab
    parameters: { test_id: WT-501 }
    expect: ok

  - function: analyze-field-failure
    principal: cqe
    parameters: { failure_id: FF-8001 }
    expect: ok

  - function: yield-pareto
    principal: fab
    parameters: {}
    expect: ok
