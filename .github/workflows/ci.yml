name: HugeGraph AI CI

on:
  pull_request:
  push:
    branches: [main, 'release-*']
  schedule:
    - cron: '0 22 * * 0' # Monday 06:00 Asia/Taipei
  workflow_dispatch:
    inputs:
      test-set:
        description: Tests to run
        type: choice
        options: [mainline, full, deployment, dependencies, codeql]
        default: mainline
      base-ref:
        description: Base ref for on-demand dependency review
        type: string
        default: main

permissions:
  contents: read
  pull-requests: read

concurrency:
  # PR diffs cover the whole branch; incremental push diffs must all finish.
  # Unique non-PR groups also prevent replacement of older pending push runs.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.run_attempt == 1 && 'head' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preflight:
    if: github.event_name != 'schedule' || github.repository == 'apache/hugegraph-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      client: ${{ steps.select.outputs.client }}
      sdk: ${{ steps.select.outputs.sdk }}
      llm: ${{ steps.select.outputs.llm }}
      mcp: ${{ steps.select.outputs.mcp }}
      quality: ${{ steps.select.outputs.quality }}
      dependencies: ${{ steps.select.outputs.dependencies }}
      codeql: ${{ steps.select.outputs.codeql }}
      version: ${{ steps.select.outputs.version }}
      server-image: ${{ steps.select.outputs.server-image }}
      uv-version: ${{ steps.select.outputs.uv-version }}
      ruff-version: ${{ steps.select.outputs.ruff-version }}
      ty-version: ${{ steps.select.outputs.ty-version }}
      python-version: ${{ steps.select.outputs.python-version }}
      client-pythons: ${{ steps.select.outputs.client-pythons }}
      sdk-pythons: ${{ steps.select.outputs.sdk-pythons }}
      llm-pythons: ${{ steps.select.outputs.llm-pythons }}
      mcp-pythons: ${{ steps.select.outputs.mcp-pythons }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected suites and read release configuration
        id: select
        env:
          TEST_SET: ${{ inputs.test-set || 'mainline' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci.py
      - name: Set up Docker Buildx for configuration checks
        if: ${{ steps.select.outputs.docker_llm == 'true' || steps.select.outputs.docker_nk == 'true' }}
        run: docker buildx create --driver docker-container --use
      - name: Check affected Docker build definitions
        if: ${{ steps.select.outputs.docker_llm == 'true' || steps.select.outputs.docker_nk == 'true' }}
        env:
          CHECK_LLM: ${{ steps.select.outputs.docker_llm }}
          CHECK_NK: ${{ steps.select.outputs.docker_nk }}
        run: |
          set -euo pipefail
          if [ "$CHECK_LLM" = true ]; then
            docker buildx build --check --progress=plain --file docker/Dockerfile.llm .
          fi
          if [ "$CHECK_NK" = true ]; then
            docker buildx build --check --progress=plain --file docker/Dockerfile.nk .
          fi
      - name: Check Docker Compose definitions
        if: steps.select.outputs.compose == 'true'
        env:
          PROJECT_PATH: ${{ runner.temp }}/hugegraph-ai
        run: |
          docker compose --env-file docker/env.template -f docker/docker-compose-llm.yml config --quiet
          docker compose --env-file docker/env.template -f docker/docker-compose-network.yml config --quiet
      - name: Check image build script
        if: steps.select.outputs.image_script == 'true'
        run: bash -n scripts/build_llm_image.sh
      - name: Check synchronized release metadata
        run: python3 scripts/version.py check
      - name: Test release tooling and CI policy
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Check license headers
        if: steps.select.outputs.license == 'true'
        uses: apache/skywalking-eyes@main
        with:
          token: ${{ github.token }}
          config: .licenserc.yaml
          log: info

  quality:
    needs: preflight
    if: needs.preflight.outputs.quality == 'true'
    uses: ./.github/workflows/ruff.yml
    with:
      uv-version: ${{ needs.preflight.outputs.uv-version }}
      ruff-version: ${{ needs.preflight.outputs.ruff-version }}
      ty-version: ${{ needs.preflight.outputs.ty-version }}
      python-version: ${{ needs.preflight.outputs.python-version }}

  client:
    needs: preflight
    if: needs.preflight.outputs.client == 'true'
    uses: ./.github/workflows/hugegraph-python-client.yml
    with:
      python-versions: ${{ needs.preflight.outputs.client-pythons }}
      integration-python: ${{ needs.preflight.outputs.python-version }}
      uv-version: ${{ needs.preflight.outputs.uv-version }}
      server-image: ${{ needs.preflight.outputs.server-image }}
      version: ${{ needs.preflight.outputs.version }}

  sdk:
    needs: preflight
    if: needs.preflight.outputs.sdk == 'true'
    uses: ./.github/workflows/hugegraph-llm-sdk.yml
    with:
      python-versions: ${{ needs.preflight.outputs.sdk-pythons }}
      primary-python: ${{ needs.preflight.outputs.python-version }}
      uv-version: ${{ needs.preflight.outputs.uv-version }}
      ty-version: ${{ needs.preflight.outputs.ty-version }}
      version: ${{ needs.preflight.outputs.version }}

  llm:
    needs: preflight
    if: needs.preflight.outputs.llm == 'true'
    uses: ./.github/workflows/hugegraph-llm.yml
    with:
      python-versions: ${{ needs.preflight.outputs.llm-pythons }}
      integration-python: ${{ needs.preflight.outputs.python-version }}
      uv-version: ${{ needs.preflight.outputs.uv-version }}
      server-image: ${{ needs.preflight.outputs.server-image }}
      version: ${{ needs.preflight.outputs.version }}

  mcp:
    needs: preflight
    if: needs.preflight.outputs.mcp == 'true'
    uses: ./.github/workflows/hugegraph-mcp.yml
    with:
      python-versions: ${{ needs.preflight.outputs.mcp-pythons }}
      integration-python: ${{ needs.preflight.outputs.python-version }}
      uv-version: ${{ needs.preflight.outputs.uv-version }}
      ty-version: ${{ needs.preflight.outputs.ty-version }}
      server-image: ${{ needs.preflight.outputs.server-image }}
      version: ${{ needs.preflight.outputs.version }}

  dependencies:
    needs: preflight
    if: >-
      needs.preflight.outputs.dependencies == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/check-dependencies.yml
    with:
      base-ref: ${{ github.event.pull_request.base.sha || inputs.base-ref || 'main' }}
      head-ref: ${{ github.sha }}

  codeql:
    needs: preflight
    if: needs.preflight.outputs.codeql == 'true'
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  result:
    name: CI Result
    if: always() && (github.event_name != 'schedule' || github.repository == 'apache/hugegraph-ai')
    needs: [preflight, quality, client, sdk, llm, mcp, dependencies, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful selected checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] not in ('success', 'skipped')]
          if results['preflight']['result'] != 'success':
              failed.append('preflight')
          if failed:
              sys.exit('CI did not pass: ' + ', '.join(sorted(set(failed))))
          PY
