name: HugeGraph-LLM CI

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        required: true
      integration-python:
        type: string
        required: true
      uv-version:
        type: string
        required: true
      server-image:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

jobs:
  tests:
    name: llm / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    services:
      hugegraph:
        image: ${{ matrix.python-version == inputs.integration-python && inputs.server-image || '' }}
        env:
          PASSWORD: admin
        options: >-
          --health-cmd="curl -f http://localhost:8080/versions || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=12 --health-start-period=90s
        ports:
          - 8080:8080
    env:
      HUGEGRAPH_URL: http://127.0.0.1:8080
      HUGEGRAPH_GRAPH: hugegraph
      HUGEGRAPH_USER: admin
      HUGEGRAPH_PASSWORD: admin
      HUGEGRAPH_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-env
        id: python-env
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ inputs.uv-version }}
          component: llm
      - name: Cache NLP data
        uses: actions/cache@v5
        with:
          path: |
            ~/nltk_data
            ${{ runner.temp }}/tiktoken
          key: ${{ runner.os }}-nlp-data-v1
      - name: Install LLM and test dependencies
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: |
          uv sync --extra llm --extra vectordb --extra dev
          uv run --no-sync python - <<'PYTHON'
          import nltk
          for package in ('stopwords', 'punkt', 'punkt_tab'):
              if not nltk.download(package, quiet=True, raise_on_error=True):
                  raise RuntimeError(f'Failed to download {package}')
          PYTHON
      - name: Run unit and contract tests
        env:
          SKIP_EXTERNAL_SERVICES: 'true'
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --no-sync pytest hugegraph-llm/src/tests
          -m "not integration and not hugegraph and not smoke and not external"
          --cov=hugegraph_llm --cov-fail-under=34 --cov-report=term
          --cov-report=xml:llm-unit-contract.xml -v --tb=short --durations=20
      - name: Verify HugeGraph image and version
        if: matrix.python-version == inputs.integration-python
        env:
          EXPECTED_SERVER_VERSION: ${{ inputs.version }}
          HUGEGRAPH_CONTAINER_ID: ${{ job.services.hugegraph.id }}
        run: bash scripts/check_hugegraph.sh "$EXPECTED_SERVER_VERSION" "$HUGEGRAPH_CONTAINER_ID"
      - name: Run HugeGraph boundary and core smoke tests
        if: matrix.python-version == inputs.integration-python
        env:
          SKIP_EXTERNAL_SERVICES: 'false'
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/tiktoken
        run: >-
          uv run --no-sync pytest hugegraph-llm/src/tests
          -m "(integration and hugegraph) or smoke" -v --tb=short
      - name: Type check LLM (advisory while existing diagnostics are resolved)
        if: matrix.python-version == inputs.integration-python
        continue-on-error: true
        run: uv run --no-sync ty check hugegraph-llm/src/hugegraph_llm
      - uses: actions/upload-artifact@v7
        with:
          name: llm-unit-contract-coverage-${{ matrix.python-version }}
          path: llm-unit-contract.xml
          retention-days: 7
          if-no-files-found: error
      - name: Dump HugeGraph diagnostics
        if: failure() && matrix.python-version == inputs.integration-python
        run: |
          docker ps -a
          docker logs "${{ job.services.hugegraph.id }}"
      - name: Prune uv cache before upload
        if: always() && steps.python-env.outcome == 'success'
        run: uv cache prune --ci
