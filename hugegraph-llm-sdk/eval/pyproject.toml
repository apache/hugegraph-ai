[project]
# Release version is synchronized by scripts/version.py from the root pyproject.toml.
name = "hugegraph-llm-eval"
version = "1.8.0"
description = "Standalone evaluation runtime for GraphRAG retrieval, answers and property graphs."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Apache HugeGraph Contributors", email = "dev@hugegraph.apache.org" }]
dependencies = ["pydantic>=2.14,<3"]

[project.optional-dependencies]
graph = ["networkx>=3.2,<4"]
rouge = ["rouge-score>=0.1.2,<1", "jieba>=0.42,<1"]
openai = ["openai>=2.20,<3"]

[project.urls]
repository = "https://github.com/apache/hugegraph-ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugegraph_llm_eval"]

[tool.hatch.build.targets.sdist]
include = ["src/hugegraph_llm_eval", "README.md", "LICENSE", "NOTICE", "examples"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = ["unit: fast deterministic tests without network or Docker"]
