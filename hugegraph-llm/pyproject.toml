[project]
# Release version is synchronized by scripts/version.py from the root pyproject.toml.
name = "hugegraph-llm"
version = "1.8.0"
description = "A tool for the implementation and research related to large language models."
authors = [
    { name = "Apache HugeGraph Contributors", email = "dev@hugegraph.apache.org" },
]
maintainers = [
    { name = "Apache HugeGraph Contributors", email = "dev@hugegraph.apache.org" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "hugegraph-llm-sdk==1.8.0",
    # Common dependencies
    "requests>=2.34,<3",

    # Data processing dependencies
    "numpy>=2.5,<3",
    "pandas>=3.1,<4",
    "pydantic>=2.14,<3",
    "tqdm>=4.70,<5",
    "scipy>=1.18,<2",
    "networkx>=3.6,<4",
    "regex>=2026.9",

    # LLM specific dependencies
    "openai>=2.20,<3",
    "ollama>=0.6.3,<1",
    "tenacity>=9.2,<10",
    "tiktoken>=0.14,<1",
    "nltk>=3.10,<4",
    "gradio>=6.31,<7",
    "jieba>=0.42.1",
    "python-docx>=1.2,<2",
    "pypdf>=6.21,<7",
    "langchain-text-splitters>=1.1,<2",
    "faiss-cpu>=1.15,<2",
    "python-dotenv>=1.2,<2",
    "openpyxl>=3.1.5,<4",
    "pydantic-settings>=2.16,<3",
    "apscheduler>=3.11,<4",
    "fastapi>=0.136,<1",
    "httpx>=0.28,<1",
    "starlette>=1.0.1,<2",
    "uvicorn>=0.54,<1",
    "PyYAML>=6.0.3,<7",
    "hugegraph-python>=1.8.0,<2",
    "pycgraph==3.2.2", # 3.3.0 has no CPython 3.14 Linux wheel or source distribution on PyPI.
]

[project.optional-dependencies]
vectordb = [
    "pymilvus>=3.0.2,<4",
    "qdrant-client>=1.20,<2",
]

[project.urls]
homepage = "https://hugegraph.apache.org/"
repository = "https://github.com/apache/hugegraph-ai"
documentation = "https://hugegraph.apache.org/docs/quickstart/hugegraph-ai/"
bug_tracker = "https://github.com/apache/hugegraph-ai/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugegraph_llm"]

[tool.hatch.build.targets.sdist]
include = [
    "src/hugegraph_llm",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
hugegraph-llm-sdk = { workspace = true }
hugegraph-python = { workspace = true }
# The published Linux wheel needs a newer libstdc++ than Debian Bookworm.
# Build the same immutable 3.2.2 release commit used by the Docker image.
pycgraph = { git = "https://github.com/ChunelFeng/CGraph.git", subdirectory = "python", rev = "f224e02339f8de73b34054c8a9db1236b64ede86", marker = "sys_platform == 'linux'" }

[tool.ruff]
line-length = 120
indent-width = 4
extend-exclude = []

# TODO: move this config in the root pyproject.toml & add more rules for it
[tool.ruff.lint]
# Keep the existing lint baseline explicit across Ruff default-rule changes.
select = ["E4", "E7", "E9", "F"]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "preserve"
indent-style = "space"
line-ending = "auto"
