[project]
name = "hugegraph-ai"
version = "1.8.0"
description = "A repository for AI-related projects for Apache HugeGraph."
authors = [
    { name = "Apache HugeGraph Contributors", email = "dev@hugegraph.apache.org" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
maintainers = [
    { name = "Apache HugeGraph Contributors", email = "dev@hugegraph.apache.org" },
]

dependencies = [
    # Common dependencies can be listed here if any,
    # but it's generally better to keep them within extras for clarity
]

[project.optional-dependencies]
llm = ["hugegraph-llm"]
vectordb = ["hugegraph-llm[vectordb]"]
python-client = ["hugegraph-python"]
vermeer = ["vermeer-python-client"]
dev = [
    "pytest>=9.2,<10",
    "pytest-cov>=7.1,<8",
    "coverage[toml]>=7.17,<8",
    "ruff>=0.17.3",
    "ty>=0.0.93",
    "pre-commit>=4.7",
]

nk-llm = ["hugegraph-llm", "hugegraph-python", "nuitka"]
all = ["hugegraph-python", "hugegraph-llm", "vermeer-python-client"]

[project.urls]
homepage = "https://hugegraph.apache.org/"
repository = "https://github.com/apache/hugegraph-ai"
documentation = "https://hugegraph.apache.org/docs/quickstart/hugegraph-ai/"
bug_tracker = "https://github.com/apache/hugegraph-ai/issues"
changelog = "https://github.com/apache/hugegraph-ai/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: If you experience slow download speeds, uncomment the lines below to use mirror source
# [[tool.uv.index]]
# url = "https://pypi.tuna.tsinghua.edu.cn/simple" # Example mirror for users in China
# default = true
#
# Alternatively, configure globally: uv config --global index.url https://pypi.tuna.tsinghua.edu.cn/simple
# To reset to default: uv config --global index.url https://pypi.org/simple

[tool.hatch.metadata] # Keep this if the hatch is still used by submodules, otherwise remove
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "hugegraph-llm",
    "hugegraph-python-client"
]

[tool.hatch.build.targets.sdist]
include = ["*/src", "*/pyproject.toml", "*/README.md", "*/LICENSE", "*/NOTICE", "graphrag/*/src", "graphrag/*/pyproject.toml", "graphrag/*/README.md", "graphrag/*/LICENSE", "graphrag/*/NOTICE", "README.md", "LICENSE", "NOTICE"]

[tool.uv.sources]
hugegraph-llm = { workspace = true }
hugegraph-llm-sdk = { workspace = true }
hugegraph-llm-eval = { workspace = true }
hugegraph-python = { workspace = true }
vermeer-python-client = { path = "vermeer-python-client", editable = true }

[tool.uv.workspace]
members = [
    "hugegraph-llm-sdk",
    "graphrag/eval",
    "hugegraph-llm",
    "hugegraph-python-client"
]

[tool.hugegraph.release]
server-image = "hugegraph/hugegraph:latest"
llm-image = "hugegraph/rag"

[tool.hugegraph.ci]
uv-version = "0.13.6"
python-version = "3.12"

[tool.pytest.ini_options]
markers = [
    "unit: fast deterministic tests without network or Docker",
    "contract: public contract tests; may use mocks but verify stable behavior",
    "integration: tests requiring a real local service such as HugeGraph",
    "hugegraph: tests requiring HugeGraph Server",
    "live: requires a real HugeGraph Server",
    "real_hugegraph: requires a real HugeGraph Server",
    "llm: requires HugeGraph-AI or an external LLM provider",
    "smoke: end-to-end-ish high-value smoke over production pipeline boundaries",
    "external: tests requiring external provider credentials or non-HugeGraph services",
    "slow: long-running tests excluded from default local loops",
]
addopts = "--strict-markers --strict-config"

[tool.coverage.run]
# Avoid CPython 3.12's slow sys.settrace instrumentation of Jieba's large tables.
core = "sysmon"

# for code format
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Select a broad set of rules for comprehensive checks.
# E: pycodestyle Errors, F: Pyflakes, W: pycodestyle Warnings, I: isort
# C: flake8-comprehensions, N: pep8-naming
# UP: pyupgrade, B: flake8-bugbear, SIM: flake8-simplify, T20: flake8-print
select = ["E", "F", "W", "I", "C", "N", "UP", "B", "SIM", "T20", "RUF"]

# Ignore specific rules
ignore = [
    "UP042", # Preserve public str/Enum string representations; StrEnum changes __str__.
    "PYI041", # redundant-numeric-union: keep clear 'int | float' for type hinting
    "N812",    # lowercase-imported-as-non-lowercase
    "N806",    # non-lowercase-variable-in-function
    "N803",    # invalid-argument-name
    "N802",    # invalid-function-name (API compatibility)
    "C901",    # complexity (non-critical for now)
    "RUF001", # ambiguous-unicode-character-string
    "RUF002", # ambiguous-unicode-character-docstring (Chinese prose)
    "RUF003", # ambiguous-unicode-character-comment
]
# No need to ignore E501 (line-too-long), `ruff format` will handle it automatically.

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["T20"]
"hugegraph-ml/src/hugegraph_ml/examples/**/*.py" = ["T20"]
"graphrag/eval/examples/**/*.py" = ["T20"]
"hugegraph-python-client/src/pyhugegraph/structure/*.py" = ["N802"]

[tool.ruff.lint.isort]
known-first-party = ["hugegraph_llm", "hugegraph_llm_sdk", "hugegraph_llm_eval", "hugegraph_mcp", "hugegraph_python_client", "hugegraph_ml", "vermeer_python_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.ty.rules]
# Start permissive; tighten incrementally as errors are fixed
