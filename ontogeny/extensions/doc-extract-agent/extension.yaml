apiVersion: ontogeny-ext/v1
name: doc-extract-agent
display: 文档抽取（外部 Agent）
description: "把本体 schema 和文档交给外部 Agent（命令行 stdin/stdout JSON 或 HTTP 端点），由 Agent 返回图结构；平台不调用模型"
kind: document-extractor
provides: [capability:document-extractor]
requires: []
entry:
  module: ontogeny_ext_agent_extract
  function: register
config:
  ONTOGENY_DOC_AGENT_CMD:
    required: false
    description: "外部 Agent 命令（JSON 请求从 stdin 进入，JSON 响应从 stdout 返回）"
  ONTOGENY_DOC_AGENT_URL:
    required: false
    description: "外部 Agent HTTP 端点（POST JSON）"
  ONTOGENY_DOC_AGENT_TOKEN:
    required: false
    description: "HTTP 端点 Bearer token"
  ONTOGENY_DOC_AGENT_TIMEOUT_S:
    required: false
    description: "单次 Agent 调用超时（默认 600s）"
