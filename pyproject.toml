[project]
name = "ontogeny"
version = "0.3.0"
description = "ontogeny - self-improving operational ontology platform (RSI), reference backend implementation"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0.29",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
cedar = ["cedarpy>=0.5"]
llm = ["litellm>=1.30"]
queue = ["arq>=0.25", "redis>=5.0"]
mcp = ["mcp>=2.2,<3"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[tool.ruff]
line-length = 120
target-version = "py310"
# domain packages' functions/*.py are USER code shipped as data (they see a
# `ontogeny` shim injected by the sandbox at runtime); runtime state dirs are not
# source at all
extend-exclude = ["domains", ".ontogeny-*", ".kina-*", ".oo-verify", "web"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[project.scripts]
ontogeny = "ontogeny.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/ontogeny"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["server"]
filterwarnings = ["ignore::DeprecationWarning"]
