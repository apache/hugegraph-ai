[project]
name = "ontogeny"
version = "0.3.0"
description = "ontogeny - self-improving operational ontology platform (RSI), reference backend implementation"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "certifi>=2026.10.19",  # GHSA-6q48-6c7w-9gw2 (critical): emSign root CA compromise
  "sqlalchemy[asyncio]>=2.0.29",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
llm = ["litellm>=1.30"]
queue = ["arq>=0.25", "redis>=5.0"]
mcp = ["mcp>=2.2,<3"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.4",
]

[project.scripts]
ontogeny = "ontogeny.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/ontogeny"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["server"]
filterwarnings = ["ignore::DeprecationWarning"]
