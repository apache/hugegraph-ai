apiVersion: ontogeny/v1
kind: Action
metadata:
  name: introduce-product
  display: Introduce product
  description: Register a new sellable product in the catalogue
spec:
  target: product
  parameters:
    name:
      type: string
      display: Product name
      required: true
    category:
      type: enum[MACHINE, MODULE, SPARE]
      display: Category
    unit_price:
      type: decimal(14,2)
      display: Unit price
  policy: production
  effects:
  - kind: create-object
    properties:
      product_id: newId('P')
      name: parameters.name
      category: parameters.category
      unit_price: parameters.unit_price
      status: ACTIVE
      created_at: now()
  audit:
    fields:
    - target.product_id
    - parameters
