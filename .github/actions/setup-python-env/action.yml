name: Set up cached Python dependencies
description: Install the shared uv version and restore caches for a module and Python runtime
inputs:
  python-version:
    required: true
    description: Python runtime
  uv-version:
    required: true
    description: uv version from root configuration
  component:
    required: true
    description: Cache namespace
runs:
  using: composite
  steps:
    # Use GitHub-owned actions to respect ASF's action allowlist.
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cache/uv
          ~/.cache/pip
        key: ${{ runner.os }}-uv-${{ inputs.uv-version }}-${{ inputs.component }}-${{ inputs.python-version }}-${{ hashFiles('pyproject.toml', 'hugegraph-python-client/pyproject.toml', 'hugegraph-llm-sdk/pyproject.toml', 'graphrag/eval/pyproject.toml', format('hugegraph-{0}*/pyproject.toml', inputs.component)) }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ inputs.uv-version }}-${{ inputs.component }}-${{ inputs.python-version }}-
    - name: Install shared uv version
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
        PYTHON_VERSION: ${{ inputs.python-version }}
      run: |
        python -m pip install --disable-pip-version-check "uv==$UV_VERSION"
        echo "UV_PYTHON=$PYTHON_VERSION" >> "$GITHUB_ENV"
