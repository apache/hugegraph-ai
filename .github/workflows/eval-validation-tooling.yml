name: Eval validation tooling
on:
  push:
    branches: [feat/eval-sdk]
    paths: [.github/workflows/eval-validation-tooling.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Build offline validation dependencies
        run: >-
          python -m pip wheel --wheel-dir "$RUNNER_TEMP/eval-validation-tools"
          'ruff>=0.17.3' 'ty>=0.0.93' 'pydantic>=2.14,<3'
          'openai>=2.20,<3' 'rouge-score>=0.1.2,<1' 'jieba>=0.42,<1'
          'hatchling' 'pytest>=9.2,<10' 'networkx>=3.2,<4'
      - uses: actions/upload-artifact@v7
        with:
          name: eval-validation-tools
          retention-days: 1
          path: ${{ runner.temp }}/eval-validation-tools/
