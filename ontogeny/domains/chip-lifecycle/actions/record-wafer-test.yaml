apiVersion: ontogeny/v1
kind: Action
metadata:
  name: record-wafer-test
  display: Record wafer test
  description: Record a CP test result for a lot
spec:
  target: wafer-test
  parameters:
    lot_id:
      type: string
      display: Wafer lot
      required: true
    tested_qty:
      type: integer
      display: Tested quantity
      required: true
    defect_qty:
      type: integer
      display: Defect quantity
      required: true
    result:
      type: enum[PASS, FAIL, PENDING]
      display: Result
      required: true
    tester:
      type: string
      display: Tester
  rules:
  - expr: parameters.tested_qty > 0
    message: Tested quantity must be positive
  - expr: parameters.defect_qty <= parameters.tested_qty
    message: Defects cannot exceed the tested quantity
  policy: lifecycle
  effects:
  - when: parameters.result == 'FAIL'
    kind: emit-event
    payload:
      event: yield.alert
  - kind: create-object
    properties:
      test_id: newId('WT')
      lot_id: parameters.lot_id
      tested_qty: parameters.tested_qty
      defect_qty: parameters.defect_qty
      result: parameters.result
      tester: parameters.tester
      tested_at: now()
  audit:
    fields:
    - target.test_id
    - parameters
