apiVersion: ontogeny/v1
metadata:
  name: supplier-risk
  display: Supplier risk (documents)
  description: 'Supplier master data from the ERP plus risk notes extracted from documents. Demonstrates the document data source: the corpus is bound to the ontology by schema-constrained extraction, every accepted value keeps its source chunk, and ambiguous facts wait in a review queue.'
