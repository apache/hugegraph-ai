apiVersion: ontogeny/v1
kind: Function
metadata:
  name: requirement-impact
  display: Requirement impact
  description: Forward impact of one requirement — the design modules that implement it,
    the tapeout versions that include them and the wafer lots at risk
spec:
  runtime: python
  entry: requirement_impact.py:requirement_impact
  parameters:
    requirement_id:
      type: string
      required: true
      display: Requirement ID
  returns:
    type: string
    display: Impact report (JSON)
  capabilities:
  - read-objects:
    - requirement
    - design-module
    - tapeout-version
    - wafer-lot
