apiVersion: ontogeny/v1
kind: Action
metadata:
  name: raise-surge-alert
  display: Raise surge alert
  description: Record a batch-clustering alert on a field failure; the alert is state, not a separate entity
spec:
  target: field-failure
  parameters:
    severity:
      type: "enum[INFO, WARN, MAJOR, CRITICAL]"
      required: true
      display: Severity
    kind:
      type: "enum[DEFECT_SURGE]"
      required: true
      display: Alert kind
  rules:
  - expr: target.status != 'CLOSED'
    message: Closed failures cannot be alerted
  policy: lifecycle
  effects:
  - kind: modify-target
    set:
      alert_status: OPEN
      alert_severity: parameters.severity
      alert_kind: parameters.kind
      alerted_at: now()
  audit:
    fields:
    - target.failure_id
    - parameters
