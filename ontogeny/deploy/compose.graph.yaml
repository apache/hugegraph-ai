# Connect to a separately configured HugeGraph server with authentication.
# Recommended image: hugegraph/hugegraph:latest (currently 1.8).
# The graph extension creates the ontology's graph using these credentials.
services:
  ontogeny:
    environment:
      ONTOGENY_STORAGE_PROVIDER: hugegraph
      HUGEGRAPH_URL: ${HUGEGRAPH_URL:?set HUGEGRAPH_URL}
      HUGEGRAPH_USER: ${HUGEGRAPH_USER:?set HUGEGRAPH_USER}
      HUGEGRAPH_PASSWORD: ${HUGEGRAPH_PASSWORD:?set HUGEGRAPH_PASSWORD}
      HUGEGRAPH_DATA_DIR: ${HUGEGRAPH_DATA_DIR:-}
