[project]
# Release version is synchronized by scripts/version.py from the root pyproject.toml.
name = "hugegraph-llm-sdk"
version = "1.8.0"
description = "Standalone schema design and reviewed property-graph extraction for Python."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Apache HugeGraph Contributors", email = "dev@hugegraph.apache.org" }]
dependencies = ["pydantic>=2.14,<3"]

[project.optional-dependencies]
openai = ["openai>=2.20,<3", "tenacity>=9.2,<10", "tiktoken>=0.14,<1"]
ollama = ["ollama>=0.6.3,<1", "tenacity>=9.2,<10"]
litellm = ["litellm>=1.106.5,<2", "tenacity>=9.2,<10", "tiktoken>=0.14,<1"]

[project.urls]
repository = "https://github.com/apache/hugegraph-ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hugegraph_llm_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src/hugegraph_llm_sdk", "/README.md", "/LICENSE", "/NOTICE", "/examples"]
exclude = ["/eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
