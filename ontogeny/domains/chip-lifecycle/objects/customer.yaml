apiVersion: ontogeny/v1
kind: ObjectType
metadata:
  name: customer
  display: Customer
  description: A customer account that receives chips
spec:
  primaryKey:
  - customer_id
  properties:
    customer_id:
      type: string
      display: Customer ID
      required: true
    name:
      type: string
      display: Name
      required: true
    segment:
      type: string
      display: Segment
    region:
      type: string
      display: Region
    created_at:
      type: timestamp
      display: Created at
  backing:
    store: fab
    mode: materialized
    source:
      schema: fab
      table: customers
    mapping: {}
    sync:
      strategy: watermark
      watermark:
        column: updated_at
      schedule: '*/5 * * * *'
