# Merge with ../compose.yaml from the ontogeny/ directory.
# POSTGRES_PASSWORD must be a nonempty URL-safe password (for example hex).
services:
  ontogeny:
    environment:
      ONTOGENY_DB_DSN: postgresql+asyncpg://ontogeny:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/ontogeny
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ontogeny
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ontogeny
    volumes:
      - ontogeny-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontogeny -d ontogeny"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  ontogeny-pg:
